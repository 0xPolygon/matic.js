name: e2e

# End-to-end tier against a local kurtosis-pos devnet (packages/e2e).
# Opt-in per PR: the `run-e2e` label starts a run and every later push to a
# labelled PR re-runs it. There is no branch filter, so a PR stacked on a
# non-default base runs too. The nightly schedule keeps the tier honest
# against the pinned devnet, and a manual dispatch can switch devnet source.
#
# Two devnet sources, picked by `use_snapshot`:
#   - snapshot (default): restore the published kurtosis-pos snapshot image.
#   - cold start: boot kurtosis-pos from source at `kurtosis_pos_ref`. The
#     fallback when the snapshot is unusable; slower.
on:
  schedule:
    # 03:00 UTC, off-hours for the team.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      use_snapshot:
        description: 'Restore the published snapshot image (false = cold-start kurtosis from source)'
        type: boolean
        required: false
        default: true
      kurtosis_pos_ref:
        description: 'git ref of 0xPolygon/kurtosis-pos: cold-start source, and the snapshot restore scripts'
        required: false
        default: 'v1.4.8'
  pull_request:
    types: [labeled, synchronize, reopened]

# One devnet per ref: two in parallel would exhaust Docker resources.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The snapshot image is public and the tier uses no secrets, so the token
# needs read access to this repository and nothing else.
permissions:
  contents: read

jobs:
  e2e:
    name: e2e (kurtosis devnet)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # `use_snapshot` is null on pull_request and schedule triggers, and
      # `null == false` is truthy in expressions, so test for null first;
      # only a dispatch passing use_snapshot=false selects cold start.
      E2E_USE_SNAPSHOT: ${{ (inputs.use_snapshot != null && inputs.use_snapshot == false) && '0' || '1' }}
      # Bump the image digest and KURTOSIS_POS_REF together: the image is
      # the `v1.4.8` build of kurtosis-pos b2f5b7a8ce65, and the restore
      # scripts are taken from the same ref. Get the new digest with
      # `docker buildx imagetools inspect ghcr.io/0xpolygon/pos-devnet-small:<tag>`.
      # Pinned by digest because the tag is mutable.
      E2E_SNAPSHOT_IMAGE: ghcr.io/0xpolygon/pos-devnet-small@sha256:2544a2c6e4d8ef721e19d253fa49fcdbda13239c33c510b17fd26ce8ae5047f7
      KURTOSIS_POS_REF: ${{ inputs.kurtosis_pos_ref || 'v1.4.8' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          # .nvmrc pins a major; without check-latest the runner's cached
          # patch wins.
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bring up devnet
        run: bash .github/scripts/e2e-setup.sh

      - name: Run e2e suite
        run: pnpm run e2e

      - name: Collect devnet logs
        if: failure()
        run: bash .github/scripts/e2e-setup.sh dump

      - name: Upload devnet dump
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devnet-dump-${{ github.run_id }}
          path: /tmp/devnet-dump
          retention-days: 7
