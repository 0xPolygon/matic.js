name: Meta sync

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Exact @polygonlabs/meta version (default: latest on npm)'
        required: false
        type: string
      dry_run:
        description: 'Use the scratch branch and a [dry run] title; allows an older target'
        required: false
        type: boolean
        default: false
      open_when:
        description: 'relevant: open a pull request only when the bump touches something the SDK depends on; any: open one for every bump'
        required: false
        type: choice
        options:
          - relevant
          - any
        default: relevant

permissions: {}

concurrency:
  group: meta-sync
  cancel-in-progress: false

jobs:
  # This job installs and runs the newly published package, so it holds no
  # credential and no secret: a malicious release can write only to this
  # runner, and what it hands on is an allowlisted artifact that the next
  # job re-checks.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      relevant: ${{ steps.prepare.outputs.relevant }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      target: ${{ steps.prepare.outputs.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - id: prepare
        env:
          META_SYNC_TARGET: ${{ inputs.target_version }}
          META_SYNC_DRY_RUN: ${{ inputs.dry_run }}
          META_SYNC_OPEN_WHEN: ${{ inputs.open_when }}
        run: node .github/scripts/meta-sync/prepare.mjs --out "$RUNNER_TEMP/meta-sync-out"

      - if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta-sync-out
          path: ${{ runner.temp }}/meta-sync-out
          include-hidden-files: true
          if-no-files-found: error

  # This job holds the App token, so it installs nothing and runs no package
  # code: it only calls the API, and the artifact it reads is validated
  # against an allowlist before anything is committed. A day with nothing new,
  # or a bump nothing in the SDK depends on, never reaches it, so the App
  # secrets are required only for a bump worth a pull request.
  open-pr:
    name: open-pr
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && (inputs.open_when == 'any' || needs.prepare.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_APP: ${{ secrets.META_SYNC_BOT_APP_ID != '' && secrets.META_SYNC_BOT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Require the App credentials
        run: |
          if [ "$HAS_APP" != "true" ]; then
            echo "::error::Secrets META_SYNC_BOT_APP_ID and META_SYNC_BOT_APP_PRIVATE_KEY must both be set to open the meta sync pull request."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-sync-out
          path: ${{ runner.temp }}/meta-sync-out

      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.META_SYNC_BOT_APP_ID }}
          private-key: ${{ secrets.META_SYNC_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          META_SYNC_OUT: ${{ runner.temp }}/meta-sync-out
          META_SYNC_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./.github/scripts/meta-sync/open-pr.cjs')({ github, context, core })
