name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: CI - lint / typecheck / test
    runs-on: ubuntu-latest
    # Live-read RPC endpoints for the test suite. The shared
    # `0xPolygon/pipelines/.github/actions/ci@main` composite action runs
    # `pnpm test` in this job, so URLs the compose step exports through
    # $GITHUB_ENV reach vitest without any further passing.
    #
    # Base URLs are repo variables; the API key is the only secret. The
    # compose step joins them (see .github/scripts/compose-rpc-env.sh) and
    # writes nothing when the key is absent — fork PRs get no secrets, so
    # there the live-read tests fall back to their public defaults or
    # skip. No private key is configured: write-path tests stay skipped.
    # The `e2e` cycle test is never enabled on this PR workflow.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - name: Compose test RPC env
        if: "!startsWith(github.head_ref, 'changeset-release/')"
        env:
          POS_SDK_TEST_ETHEREUM_RPC_URL: ${{ vars.POS_SDK_TEST_ETHEREUM_RPC_URL }}
          POS_SDK_TEST_POLYGON_RPC_URL: ${{ vars.POS_SDK_TEST_POLYGON_RPC_URL }}
          POS_SDK_TEST_SEPOLIA_RPC_URL: ${{ vars.POS_SDK_TEST_SEPOLIA_RPC_URL }}
          POS_SDK_TEST_AMOY_RPC_URL: ${{ vars.POS_SDK_TEST_AMOY_RPC_URL }}
          POS_SDK_TEST_ERPC_API_KEY: ${{ secrets.POS_SDK_TEST_ERPC_API_KEY }}
        run: .github/scripts/compose-rpc-env.sh

      - uses: 0xPolygon/pipelines/.github/actions/ci@main

  build:
    # Verify the tsup build succeeds across the Node versions the SDK
    # declares as supported (`engines.node: ">=20"`).
    #
    # The `!startsWith(github.head_ref, 'changeset-release/')` guard is
    # applied to every step rather than the job: a job-level `if:` produces
    # a `skipped` conclusion, which GitHub treats as "not run" for required
    # status checks, blocking the auto-opened Release / Deploy PR. Skipping
    # at the step level lets the job report `success` while doing no work.
    name: build (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Skip build on changeset-release branches
        if: startsWith(github.head_ref, 'changeset-release/')
        run: echo "Skipping build — Release / Deploy PRs only contain version bumps and changelog entries."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: "!startsWith(github.head_ref, 'changeset-release/')"
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - run: pnpm --filter @polygonlabs/maticjs run build
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      # Packed-tarball smoke test: packs the SDK and installs the tarball
      # into clean npm consumers (viem+ethers6, ethers5), then imports
      # every subpath at runtime and typechecks a probe with
      # skipLibCheck:false. This gates the class of defect only visible
      # in the published artifact — dist-less tarballs, declaration files
      # referencing build-time-only packages, broken exports conditions.
      # Logic lives in packages/maticjs/scripts/pack-smoke.ts (runnable
      # locally via `pnpm run test:pack`).
      - run: pnpm --filter @polygonlabs/maticjs run test:pack
        if: "!startsWith(github.head_ref, 'changeset-release/')"

  browser-smoke:
    # Real-browser verification of the BUILT artifact: packages/test-app
    # bundles the SDK dist through Vite with no Node polyfills and loads
    # it in Chromium via Playwright, exercising the public surface and
    # failing on any console error. This is the cross-environment gate
    # the Node-based vitest suites can't provide.
    name: browser smoke (test-app)
    runs-on: ubuntu-latest
    steps:
      - name: Skip on changeset-release branches
        if: startsWith(github.head_ref, 'changeset-release/')
        run: echo "Skipping — Release / Deploy PRs only contain version bumps and changelog entries."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: "!startsWith(github.head_ref, 'changeset-release/')"
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - run: pnpm --filter @polygonlabs/maticjs run build
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      # Vite-bundle the SDK dist for the browser (this build alone fails
      # if a Node builtin creeps into the dependency graph), then run the
      # Playwright smoke against the preview server.
      - run: pnpm --filter @polygonlabs/maticjs-test-app run build
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - run: pnpm --filter @polygonlabs/maticjs-test-app exec playwright install --with-deps chromium
        if: "!startsWith(github.head_ref, 'changeset-release/')"

      - run: pnpm --filter @polygonlabs/maticjs-test-app run test:browser
        if: "!startsWith(github.head_ref, 'changeset-release/')"
