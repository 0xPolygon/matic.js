version: 2
updates:
  # npm covers the pnpm workspace at the repo root (Dependabot detects
  # pnpm-lock.yaml automatically). @polygonlabs/meta is ignored here: a bump
  # of it must also regenerate the vendored ABIs, which Dependabot cannot do,
  # so its PR could never pass the codegen-drift-check gate. The meta sync
  # workflow (.github/workflows/meta-sync.yml) opens that bump instead.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: '@polygonlabs/meta'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
